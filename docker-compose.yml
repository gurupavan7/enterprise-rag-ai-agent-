services:

  backend:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: enterprise-rag-backend

    ports:
      - "8000:8000"

    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - JWT_SECRET=${JWT_SECRET}

    volumes:
      - ./data:/app/data

    restart: unless-stopped


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: enterprise-rag-frontend

    ports:
      - "5173:80"

    depends_on:
      - backend

    restart: unless-stopped
